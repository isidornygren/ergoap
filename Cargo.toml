[package]
name = "utility-goap"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/utility_goap_internal", "crates/utility_goap_macros"]

[dependencies]
utility_goap_internal = { path = "crates/utility_goap_internal" }
utility_goap_macros = { path = "crates/utility_goap_macros" }

[dev-dependencies]
bevy = { version = "0.18.0", default-features = false, features = [
    "2d",
    "debug",
] }

[workspace.lints.clippy]
all = "warn"
correctness = "deny"
suspicious = "warn"
complexity = "warn"
nursery = "warn"
perf = "warn"
style = "warn"
pedantic = { level = "warn", priority = -1 }
new-ret-no-self = { level = "allow", priority = 1 }
type-complexity = { level = "allow", priority = 1 }
match-wildcard-for-single-variants = { level = "allow", priority = 1 }
enum-variant-names = { level = "allow", priority = 1 }

[[example]]
name = "basic"
path = "examples/basic/main.rs"
resolver = "3"
required-features = ["target"]

[features]
default = ["target"]
target = ["utility_goap_internal/target"]
